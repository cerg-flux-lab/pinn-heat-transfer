name: pinn-heat
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # All Python packages are installed from requirements.txt via pip so that a
  # single spec covers CUDA (Linux/Windows) and Apple Metal/MPS (macOS arm64):
  #     conda env create -f environment.yml
  #     conda activate pinn-heat
  #     pip install -r requirements.txt
